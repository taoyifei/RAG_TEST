[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wanxiaodu-gateway"
version = "2.0.0"
description = "湾小度知识库：研发管理系统登录、资料权限与 WeKnora 网关。"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "uvicorn==0.51.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wanshitong_gateway*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "local_integration: requires an explicitly started loopback service such as Qdrant Server",
  "live_provider: requires explicit outbound-data authorization and real provider credentials",
]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "D100",
  "D104",
  "D107",
  # pydocstyle 仅识别英文句末标点，不能识别中文全角句号。
  "D400",
  "D415",
  "D203",
  "D213",
  # 中文说明与用户可见消息有意使用全角标点。
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "D103", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["wanshitong_gateway"]
exclude = ["^tests/"]
