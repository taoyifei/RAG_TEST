[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-rag"
version = "0.1.0"
description = "可追溯、可增量更新、可离线部署的 DOCX RAG。"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "lxml==6.1.1",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-docx==1.2.0",
  "qdrant-client==1.18.0",
  "tokenizers==0.23.1",
  "uvicorn==0.51.0",
]

[project.scripts]
rag-app = "rag_app.cli:main"
rag-ocr = "rag_app.ocr.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "D100",
  "D104",
  "D107",
  # pydocstyle 仅识别英文句末标点，不能识别中文全角句号。
  "D400",
  "D415",
  "D203",
  "D213",
  # 中文说明与用户可见消息有意使用全角标点。
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "D103", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rag_app"]
exclude = ["^tests/"]
