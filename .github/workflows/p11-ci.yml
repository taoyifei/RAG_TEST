name: P11 CI

on:
  push:
    branches:
      - codex/p11-release
      - feature/universal-rag
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: python310
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          update-environment: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: python scripts/dev.py check
        env:
          P11_TEST_PYTHON310: ${{ steps.python310.outputs.python-path }}

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  offline-product-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/dev.py product-check
      - run: python scripts/dev.py product-smoke
      - run: python scripts/dev.py web-e2e

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" --tag docx-rag:v1-candidate .
      - run: >-
          docker run --rm --entrypoint sh docx-rag:v1-candidate -c
          'test "$(id -u)" = 10001 &&
          test ! -e /usr/local/bin/node &&
          test ! -e /usr/local/bin/pip'
      - run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --ignore-unfixed --exit-code 1
          --severity HIGH,CRITICAL docx-rag:v1-candidate

  qdrant-integration:
    runs-on: ubuntu-latest
    services:
      qdrant-source:
        image: qdrant/qdrant:v1.18.3
        env:
          QDRANT__SERVICE__API_KEY: test-only-qdrant-key
        ports:
          - 6333:6333
      qdrant-target:
        image: qdrant/qdrant:v1.18.3
        env:
          QDRANT__SERVICE__API_KEY: test-only-qdrant-key
        ports:
          - 6334:6333
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - name: Prepare synthetic Qdrant key file
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/qdrant-api-key"
          printf %s test-only-qdrant-key > "$RUNNER_TEMP/qdrant-api-key"
      - name: Run server, snapshot and restore acceptance
        env:
          RAG_QDRANT_API_KEY: test-only-qdrant-key
          RAG_QDRANT_URL: http://127.0.0.1:6333
          RAG_TEST_QDRANT_SOURCE_KEY_FILE: ${{ runner.temp }}/qdrant-api-key
          RAG_TEST_QDRANT_SOURCE_URL: http://127.0.0.1:6333
          RAG_TEST_QDRANT_TARGET_KEY_FILE: ${{ runner.temp }}/qdrant-api-key
          RAG_TEST_QDRANT_TARGET_URL: http://127.0.0.1:6334
        run: >-
          python -m pytest -q
          tests/integration/test_qdrant_server_p11.py
          tests/integration/test_product_backup_restore.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/secret_scan.py --path src --path frontend/dist

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          docker run --rm
          -v "$PWD:/src:ro"
          -v "$RUNNER_TEMP:/output"
          anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c
          dir:/src -o cyclonedx-json=/output/p11-source.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p11-source-sbom
          path: ${{ runner.temp }}/p11-source.cdx.json
          if-no-files-found: error
