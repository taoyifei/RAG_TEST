name: P11 Live Provider

on:
  workflow_dispatch:
    inputs:
      authorization_phrase:
        description: 输入 I_AUTHORIZE_PUBLIC_SYNTHETIC_TEXT
        required: true
        type: string
      max_requests:
        description: 本次 Provider 请求总上限（21—30）
        required: true
        default: "30"
        type: string
      max_tokens:
        description: 本次估算输入 Token 总上限（最大 20000）
        required: true
        default: "20000"
        type: string

permissions:
  contents: read

jobs:
  live-provider:
    runs-on: ubuntu-latest
    environment: p11-live-provider
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.3
        env:
          QDRANT__SERVICE__API_KEY: test-only-qdrant-key
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Validate explicit authorization and budget
        env:
          AUTHORIZATION_PHRASE: ${{ inputs.authorization_phrase }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
        run: >-
          test "$AUTHORIZATION_PHRASE" = I_AUTHORIZE_PUBLIC_SYNTHETIC_TEXT &&
          test "$MAX_REQUESTS" -ge 21 && test "$MAX_REQUESTS" -le 30 &&
          test "$MAX_TOKENS" -ge 1 && test "$MAX_TOKENS" -le 20000
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - name: Prepare synthetic Qdrant key file
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/qdrant-api-key"
          printf %s test-only-qdrant-key > "$RUNNER_TEMP/qdrant-api-key"
      - name: Run bounded synthetic live acceptance
        env:
          P11_LIVE_AUTHORIZED: "true"
          P11_MAX_REQUESTS: ${{ inputs.max_requests }}
          P11_MAX_TOKENS: ${{ inputs.max_tokens }}
          RAG_TEST_NETWORK: live
          RAG_TEST_QDRANT_URL: http://127.0.0.1:6333
          RAG_TEST_QDRANT_KEY_FILE: ${{ runner.temp }}/qdrant-api-key
          JINA_API_KEY: ${{ secrets.P11_JINA_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.P11_ALIYUN_API_KEY }}
          ALIYUN_MODEL_STUDIO_WORKSPACE_ID: ${{ secrets.P11_ALIYUN_WORKSPACE_ID }}
          ALIYUN_MODEL_STUDIO_REGION: cn-beijing
        run: python -m pytest -q -m live_provider tests/live/test_p11_live_providers.py
