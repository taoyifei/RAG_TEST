server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 54:8289 的既有测试前缀代理会在转发时剥离 /kb；候选边缘同时接受剥离前后两种路径。
    location = / {
        root /usr/share/nginx/html;
        try_files /kb/index.html =404;
    }
    location = /admin { return 308 /kb/admin/; }
    location = /admin/ops { return 308 /kb/admin/overview; }
    location = /admin/ops/ { return 308 /kb/admin/overview; }
    location = /kb { return 308 /kb/; }
    location = /kb/admin { return 308 /kb/admin/; }
    location = /kb/admin/ops { return 308 /kb/admin/overview; }
    location = /kb/admin/ops/ { return 308 /kb/admin/overview; }

    # 浏览器只能到湾事通网关；不向原生 app 开放 /api/v1 或 /files。
    location ^~ /api/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /kb/api/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /kb/sso/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /sso/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /kb/admin/ops/api/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # 旧运营页书签统一进入 Vue 管理站；真实管理 API 仍走 /api/。
    location ^~ /kb/admin/ops/ {
        return 308 /kb/admin/overview;
    }

    location ^~ /admin/ops/ {
        return 308 /kb/admin/overview;
    }


    location ^~ /kb/admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /kb/admin/index.html;
    }

    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /kb/admin/$1 last;
    }

    location ^~ /kb/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /kb/index.html;
    }

    location ^~ /assets/ {
        alias /usr/share/nginx/html/kb/assets/;
    }

    location / { return 404; }
}
