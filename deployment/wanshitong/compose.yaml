name: wanshitong

services:
  wanshitong-qdrant:
    image: ${RAG_QDRANT_IMAGE:-qdrant/qdrant:v1.18.3}
    pull_policy: never
    container_name: wanshitong-qdrant
    restart: unless-stopped
    command:
      - ./qdrant
      - --config-path
      - /run/rag-secrets/qdrant.yaml
    volumes:
      - ${WANSHITONG_ROOT:?required}/qdrant:/qdrant/storage
      - ${WANSHITONG_ROOT:?required}/secrets:/run/rag-secrets:ro
    networks:
      - wanshitong-internal
    healthcheck:
      test:
        - CMD
        - /usr/bin/grep
        - -Eq
        - ^[[:space:]]*[0-9]+:[[:space:]]+[0-9A-Fa-f]{8}:18BD[[:space:]]+[0-9A-Fa-f]{8}:[0-9A-Fa-f]{4}[[:space:]]+0A[[:space:]]*
        - /proc/net/tcp
        - /proc/net/tcp6
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 15s
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  wanshitong-app:
    image: ${RAG_APP_IMAGE:?required}
    pull_policy: never
    container_name: wanshitong-app
    restart: unless-stopped
    depends_on:
      wanshitong-qdrant:
        condition: service_healthy
    environment:
      FORWARDED_ALLOW_IPS: 127.0.0.1
      RAG_PRODUCT_MODE: wanshitong
      RAG_WANSHITONG_DEMO_ALLOW_HTTP: "true"
      RAG_DATA_DIR: /data
      RAG_HOST: 0.0.0.0
      RAG_PORT: "8088"
      RAG_FRONTEND_DIR: /app/frontend
      RAG_MIGRATIONS_DIR: /app/migrations/universal_rag
      RAG_COMPATIBILITY_MANIFEST: /app/compatibility-manifest.json
      RAG_MASTER_KEY_FILE: /run/rag-secrets/master-key
      RAG_ADMIN_BOOTSTRAP_TOKEN_FILE: /run/rag-secrets/admin-bootstrap-token
      RAG_QDRANT_MODE: url
      RAG_QDRANT_URL: http://wanshitong-qdrant:6333
      RAG_QDRANT_API_KEY_FILE: /run/rag-secrets/qdrant-api-key
      RAG_TRUSTED_ORIGINS: ${RAG_TRUSTED_ORIGINS:?required}
      RAG_TRUSTED_PROXIES: ${RAG_TRUSTED_PROXIES:-}
      RAG_TRUST_LOOPBACK_HOST_PROXY: "false"
      RAG_HISTORY_SAVE_BODY: "true"
      RAG_HISTORY_RETENTION_DAYS: ${RAG_HISTORY_RETENTION_DAYS:-7}
      RAG_WANSHITONG_EMBEDDING_BASE_URL: ${RAG_WANSHITONG_EMBEDDING_BASE_URL:?required}
      RAG_WANSHITONG_EMBEDDING_MODEL: ${RAG_WANSHITONG_EMBEDDING_MODEL:-Qwen3-Embedding-0.6B}
      RAG_WANSHITONG_EMBEDDING_DIMENSION: ${RAG_WANSHITONG_EMBEDDING_DIMENSION:-1024}
      RAG_WANSHITONG_RERANKER_BASE_URL: ${RAG_WANSHITONG_RERANKER_BASE_URL:?required}
      RAG_WANSHITONG_RERANKER_MODEL: ${RAG_WANSHITONG_RERANKER_MODEL:-Qwen3-Reranker-0.6B}
      RAG_WANSHITONG_RERANKER_PROTOCOL: ${RAG_WANSHITONG_RERANKER_PROTOCOL:-tei}
      RAG_WANSHITONG_RERANKER_PATH: ${RAG_WANSHITONG_RERANKER_PATH:-/rerank}
      RAG_WANSHITONG_LLM_BASE_URL: ${RAG_WANSHITONG_LLM_BASE_URL:?required}
      RAG_WANSHITONG_LLM_MODEL: ${RAG_WANSHITONG_LLM_MODEL:-Qwen/Qwen3-8B-AWQ}
      RAG_WANSHITONG_LLM_DISABLE_THINKING_SUPPORTED: ${RAG_WANSHITONG_LLM_DISABLE_THINKING_SUPPORTED:-false}
      RAG_WANSHITONG_EMBEDDING_CREDENTIAL_ENV: ${RAG_WANSHITONG_EMBEDDING_CREDENTIAL_ENV:-}
      RAG_WANSHITONG_RERANKER_CREDENTIAL_ENV: ${RAG_WANSHITONG_RERANKER_CREDENTIAL_ENV:-}
      RAG_WANSHITONG_LLM_CREDENTIAL_ENV: ${RAG_WANSHITONG_LLM_CREDENTIAL_ENV:-}
      RAG_WANSHITONG_EMBEDDING_API_KEY_FILE: ${RAG_WANSHITONG_EMBEDDING_API_KEY_FILE:-}
      RAG_WANSHITONG_RERANKER_API_KEY_FILE: ${RAG_WANSHITONG_RERANKER_API_KEY_FILE:-}
      RAG_WANSHITONG_LLM_API_KEY_FILE: ${RAG_WANSHITONG_LLM_API_KEY_FILE:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${WANSHITONG_ROOT:?required}/data:/data
      - ${WANSHITONG_ROOT:?required}/secrets:/run/rag-secrets:ro
      - ${WANSHITONG_ROOT:?required}/logs:/logs
    networks:
      - wanshitong-internal
      - wanshitong-egress
    ports:
      - ${WANSHITONG_BIND_ADDRESS:-0.0.0.0}:${WANSHITONG_PORT:-8288}:8088
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  wanshitong-internal:
    internal: true
  wanshitong-egress:
