name: wanshitong-sso-candidate

services:
  app:
    image: ${RAG_APP_IMAGE:?required}
    pull_policy: never
    container_name: wanshitong-sso-candidate-app
    restart: unless-stopped
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?required}
      RAG_ADMIN_BOOTSTRAP_TOKEN_FILE: ${RAG_ADMIN_BOOTSTRAP_TOKEN_FILE:?required}
      RAG_COMPATIBILITY_MANIFEST: ${RAG_COMPATIBILITY_MANIFEST:?required}
      RAG_CONTEXTUAL_RERANK_MODE: ${RAG_CONTEXTUAL_RERANK_MODE:?required}
      RAG_DATA_DIR: ${RAG_DATA_DIR:?required}
      RAG_EVIDENCE_GROUP_MODE: ${RAG_EVIDENCE_GROUP_MODE:?required}
      RAG_FRONTEND_DIR: ${RAG_FRONTEND_DIR:?required}
      RAG_HISTORY_RETENTION_DAYS: ${RAG_HISTORY_RETENTION_DAYS:?required}
      RAG_HISTORY_SAVE_BODY: ${RAG_HISTORY_SAVE_BODY:?required}
      RAG_HOST: ${RAG_HOST:?required}
      RAG_MASTER_KEY_FILE: ${RAG_MASTER_KEY_FILE:?required}
      RAG_MIGRATIONS_DIR: ${RAG_MIGRATIONS_DIR:?required}
      RAG_PORT: ${RAG_PORT:?required}
      RAG_ROOT_PATH: ${RAG_ROOT_PATH:?required}
      RAG_PRIVATE_PROVIDER_DIAGNOSTIC_ACK: ${RAG_PRIVATE_PROVIDER_DIAGNOSTIC_ACK:?required}
      RAG_PRIVATE_PROVIDER_DIAGNOSTIC_DIR: ${RAG_PRIVATE_PROVIDER_DIAGNOSTIC_DIR:?required}
      RAG_PRIVATE_PROVIDER_DIAGNOSTIC_MAX_FILES: ${RAG_PRIVATE_PROVIDER_DIAGNOSTIC_MAX_FILES:?required}
      RAG_PRIVATE_PROVIDER_DIAGNOSTIC_RETENTION_SECONDS: ${RAG_PRIVATE_PROVIDER_DIAGNOSTIC_RETENTION_SECONDS:?required}
      RAG_PRODUCT_MODE: ${RAG_PRODUCT_MODE:?required}
      RAG_QDRANT_API_KEY_FILE: ${RAG_QDRANT_API_KEY_FILE:?required}
      RAG_QDRANT_MODE: ${RAG_QDRANT_MODE:?required}
      RAG_QDRANT_URL: ${RAG_QDRANT_URL:?required}
      RAG_TRUSTED_ORIGINS: ${RAG_TRUSTED_ORIGINS:?required}
      RAG_TRUSTED_PROXIES: ${RAG_TRUSTED_PROXIES-}
      RAG_TRUST_LOOPBACK_HOST_PROXY: ${RAG_TRUST_LOOPBACK_HOST_PROXY:?required}
      RAG_WANSHITONG_DEMO_ALLOW_HTTP: ${RAG_WANSHITONG_DEMO_ALLOW_HTTP:?required}
      RAG_WANSHITONG_DEPARTMENT_SHADOW_ENABLED: ${RAG_WANSHITONG_DEPARTMENT_SHADOW_ENABLED:-false}
      RAG_WANSHITONG_AUTH_MODE: ${RAG_WANSHITONG_AUTH_MODE:?required}
      RAG_WANSHITONG_SSO_CLIENT_ID: ${RAG_WANSHITONG_SSO_CLIENT_ID:?required}
      RAG_WANSHITONG_SSO_CLIENT_SECRET_FILE: ${RAG_WANSHITONG_SSO_CLIENT_SECRET_FILE:?required}
      RAG_WANSHITONG_SSO_DEPLOYMENT_ID: ${RAG_WANSHITONG_SSO_DEPLOYMENT_ID:?required}
      RAG_WANSHITONG_SSO_ENTRIES: ${RAG_WANSHITONG_SSO_ENTRIES:?required}
      RAG_WANSHITONG_SSO_VALIDATE_URL: ${RAG_WANSHITONG_SSO_VALIDATE_URL:?required}
      RAG_WANSHITONG_EMBEDDING_API_KEY_FILE: ${RAG_WANSHITONG_EMBEDDING_API_KEY_FILE-}
      RAG_WANSHITONG_EMBEDDING_BASE_URL: ${RAG_WANSHITONG_EMBEDDING_BASE_URL:?required}
      RAG_WANSHITONG_EMBEDDING_CREDENTIAL_ENV: ${RAG_WANSHITONG_EMBEDDING_CREDENTIAL_ENV-}
      RAG_WANSHITONG_EMBEDDING_DIMENSION: ${RAG_WANSHITONG_EMBEDDING_DIMENSION:?required}
      RAG_WANSHITONG_EMBEDDING_MODEL: ${RAG_WANSHITONG_EMBEDDING_MODEL:?required}
      RAG_WANSHITONG_LLM_API_KEY_FILE: ${RAG_WANSHITONG_LLM_API_KEY_FILE-}
      RAG_WANSHITONG_LLM_BASE_URL: ${RAG_WANSHITONG_LLM_BASE_URL:?required}
      RAG_WANSHITONG_LLM_CREDENTIAL_ENV: ${RAG_WANSHITONG_LLM_CREDENTIAL_ENV-}
      RAG_WANSHITONG_LLM_DISABLE_THINKING: ${RAG_WANSHITONG_LLM_DISABLE_THINKING:?required}
      RAG_WANSHITONG_LLM_DISABLE_THINKING_SUPPORTED: ${RAG_WANSHITONG_LLM_DISABLE_THINKING_SUPPORTED:?required}
      RAG_WANSHITONG_LLM_FIELD_RESOLUTION_MAX_OUTPUT_TOKENS: ${RAG_WANSHITONG_LLM_FIELD_RESOLUTION_MAX_OUTPUT_TOKENS:?required}
      RAG_WANSHITONG_LLM_FIELD_RESOLUTION_TIMEOUT_SECONDS: ${RAG_WANSHITONG_LLM_FIELD_RESOLUTION_TIMEOUT_SECONDS:?required}
      RAG_WANSHITONG_LLM_FIELD_RESOLUTION_TOTAL_DEADLINE_SECONDS: ${RAG_WANSHITONG_LLM_FIELD_RESOLUTION_TOTAL_DEADLINE_SECONDS:?required}
      RAG_WANSHITONG_LLM_MODEL: ${RAG_WANSHITONG_LLM_MODEL:?required}
      RAG_WANSHITONG_LLM_STRUCTURED_ALLOW_UNIQUE_ITEMS: ${RAG_WANSHITONG_LLM_STRUCTURED_ALLOW_UNIQUE_ITEMS:?required}
      RAG_WANSHITONG_LLM_STRUCTURED_CHAT_TEMPLATE_REVISION: ${RAG_WANSHITONG_LLM_STRUCTURED_CHAT_TEMPLATE_REVISION:?required}
      RAG_WANSHITONG_LLM_STRUCTURED_GRAMMAR_BACKEND: ${RAG_WANSHITONG_LLM_STRUCTURED_GRAMMAR_BACKEND:?required}
      RAG_WANSHITONG_LLM_STRUCTURED_OUTPUT_MODE: ${RAG_WANSHITONG_LLM_STRUCTURED_OUTPUT_MODE:?required}
      RAG_WANSHITONG_LLM_STRUCTURED_PROFILE_REVISION: ${RAG_WANSHITONG_LLM_STRUCTURED_PROFILE_REVISION:?required}
      RAG_WANSHITONG_LLM_STRUCTURED_QUALIFICATION_EVIDENCE_SHA256: ${RAG_WANSHITONG_LLM_STRUCTURED_QUALIFICATION_EVIDENCE_SHA256:?required}
      RAG_WANSHITONG_LLM_STRUCTURED_SERVICE_IDENTITY_SHA256: ${RAG_WANSHITONG_LLM_STRUCTURED_SERVICE_IDENTITY_SHA256:?required}
      RAG_WANSHITONG_RERANKER_API_KEY_FILE: ${RAG_WANSHITONG_RERANKER_API_KEY_FILE-}
      RAG_WANSHITONG_RERANKER_BASE_URL: ${RAG_WANSHITONG_RERANKER_BASE_URL:?required}
      RAG_WANSHITONG_RERANKER_CREDENTIAL_ENV: ${RAG_WANSHITONG_RERANKER_CREDENTIAL_ENV-}
      RAG_WANSHITONG_RERANKER_MODEL: ${RAG_WANSHITONG_RERANKER_MODEL:?required}
      RAG_WANSHITONG_RERANKER_PATH: ${RAG_WANSHITONG_RERANKER_PATH:?required}
      RAG_WANSHITONG_RERANKER_PROTOCOL: ${RAG_WANSHITONG_RERANKER_PROTOCOL:?required}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${CANDIDATE_DATA_DIR:?required}:/data
      - ${WANSHITONG_SECRET_DIR:?required}:/run/rag-secrets:ro
      - ${CANDIDATE_LOG_DIR:?required}:/logs
      - ${CANDIDATE_DIAGNOSTIC_DIR:?required}:/private-diagnostics
    networks:
      candidate-internal:
        aliases:
          - wanshitong-sso-candidate-app
      candidate-egress:
        aliases:
          - wanshitong-sso-candidate-app
    ports:
      - ${CANDIDATE_BIND_ADDRESS:?required}:${CANDIDATE_PORT:?required}:8088
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  candidate-internal:
    external: true
    name: ${WANSHITONG_INTERNAL_NETWORK:?required}
  candidate-egress:
    external: true
    name: ${WANSHITONG_EGRESS_NETWORK:?required}
