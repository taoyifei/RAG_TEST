# 60上的共享推理入口，供8288与8289调用；不挂载任一环境的资料或数据库。
name: ${WXD_MODEL_POOL_PROJECT:-wxd_shared_model_pool}

services:
  model-pool:
    image: ${WXD_MODEL_POOL_IMAGE:?必须填写现场已有的固定Nginx镜像ID}
    pull_policy: never
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    ports:
      - target: 8080
        published: ${WXD_MODEL_POOL_PORT:?必须先确认60上的空闲端口}
        host_ip: ${WXD_MODEL_POOL_BIND_IP:-10.242.180.60}
        protocol: tcp
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # 使用现场已验证含BusyBox wget的Nginx镜像；这里只检查代理自身。
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_signal: SIGQUIT
    stop_grace_period: 5m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
