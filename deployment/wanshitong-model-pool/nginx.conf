# 仅复用四路相同的Qwen3-8B；各vLLM实例负责其MAX_NUM_SEQS=2的执行与排队。
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # 不记录请求正文、问题、回答或鉴权头；保留实际上游及耗时供并发核对。
    log_format model_pool '$time_iso8601 method=$request_method uri=$uri '
                          'status=$status upstream=$upstream_addr '
                          'seconds=$request_time upstream_seconds=$upstream_response_time';
    access_log /dev/stdout model_pool;

    upstream wxd_qwen_pool {
        zone wxd_qwen_pool 64k;
        least_conn;
        server 10.242.180.57:8000 max_fails=1 fail_timeout=10s;
        server 10.242.180.57:8001 max_fails=1 fail_timeout=10s;
        server 10.242.180.58:8000 max_fails=1 fail_timeout=10s;
        server 10.242.180.58:8001 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 4m;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /v1/ {
            proxy_pass http://wxd_qwen_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_request_buffering on;

            # 未启用non_idempotent：请求已送入模型或流已开始后不重放生成。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            # 仅模型内网入口返回，便于核对真实分流，不进入员工页面。
            add_header X-WXD-Model-Upstream $upstream_addr always;
        }

        location / {
            return 404;
        }
    }
}
