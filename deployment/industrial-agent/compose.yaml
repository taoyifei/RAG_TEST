# 工业智能体独立部署。数据路径和身份服务须由部署人员配置。
name: ${IA_PROJECT_NAME:-industrial-agent}
services:
  app:
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${IA_APP_IMAGE:-industrial-agent/engine:0.9.0}
    build:
      context: ../../vendor/knowledge-engine
      dockerfile: docker/Dockerfile.app
      args:
        WITH_BROWSERSKILL: '0'
    pull_policy: never
    entrypoint:
    - /bin/sh
    - /opt/industrial-agent/knowledgeengine-secrets-entrypoint.sh
    command:
    - ./KnowledgeEngine
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
      LOG_LEVEL: info
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      UV_OFFLINE: 'true'
      PIP_NO_INDEX: '1'
      AUTO_MIGRATE: 'true'
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: industrial_agent
      DB_NAME: industrial_agent
      RETRIEVE_DRIVER: postgres
      DOCREADER_ADDR: docreader:50051
      DOCREADER_TRANSPORT: grpc
      REDIS_ADDR: redis:6379
      REDIS_PREFIX: industrial_agent
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      DISABLE_REGISTRATION: ${IA_DISABLE_REGISTRATION:-true}
      KNOWLEDGE_ENGINE_TENANT_SELF_SERVICE_CREATION_ENABLED: ${IA_NATIVE_WORKBENCH_PROVISIONING:-false}
      KNOWLEDGE_ENGINE_TENANT_MAX_OWNED_PER_USER: ${IA_NATIVE_MAX_OWNED_WORKSPACES:-10}
      KNOWLEDGE_ENGINE_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${IA_NATIVE_BOOTSTRAP_ADMIN_EMAIL:-}
      KNOWLEDGE_ENGINE_TENANT_ENABLE_CROSS_TENANT_ACCESS: 'false'
      KNOWLEDGE_ENGINE_SANDBOX_DOCKER_ENABLED: 'false'
      BROWSERSKILL_BINARY: ''
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_OPTIONAL: 'true'
      LANGFUSE_ENABLED: 'false'
      SSRF_DNS_WHITELIST_ONLY: 'true'
      SSRF_WHITELIST: ${IA_ALLOWED_MODEL_HOSTS:?必须填内网模型服务主机白名单}
      SSRF_WHITELIST_EXTRA: docreader,rerank-adapter,ocr-relay
      CONCURRENCY_POOL_SIZE: '1'
      KNOWLEDGE_ENGINE_MODEL_MAX_CONCURRENCY: '1'
    secrets:
    - db_password
    - redis_password
    - jwt_secret
    - system_aes_key
    - system_signing_key
    volumes:
    - native-files:/data/files
    - docreader-tmp:/tmp/docreader:ro
    - ./config/config.yaml:/app/config/config.yaml:ro
    - ${IA_MODELS_FILE:-./config/builtin_models.example.yaml}:/app/config/builtin_models.yaml:ro
    - ./knowledgeengine-secrets-entrypoint.sh:/opt/industrial-agent/knowledgeengine-secrets-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docreader:
        condition: service_healthy
      rerank-adapter:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - engine
    - data
    - model-egress
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  docreader:
    logging: *id001
    image: ${IA_DOCREADER_IMAGE:-industrial-agent/docreader:0.9.0}
    build:
      context: ../../vendor/knowledge-engine
      dockerfile: docker/Dockerfile.docreader
    pull_policy: never
    environment:
      TZ: Asia/Shanghai
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      UV_OFFLINE: 'true'
      PIP_NO_INDEX: '1'
      DOCREADER_GRPC_PORT: '50051'
      DOCREADER_ODL_HYBRID: 'off'
      SSRF_DNS_WHITELIST_ONLY: 'true'
      SSRF_WHITELIST_EXTRA: ''
    volumes:
    - docreader-tmp:/tmp/docreader
    expose:
    - '50051'
    healthcheck:
      test:
      - CMD
      - grpc_health_probe
      - -addr=localhost:50051
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - engine
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  postgres:
    logging: *id001
    image: paradedb/paradedb@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2
    pull_policy: never
    environment:
      POSTGRES_USER: industrial_agent
      POSTGRES_DB: industrial_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
    - db_password
    volumes:
    - native-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U industrial_agent -d industrial_agent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
    - data
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
    - no-new-privileges:true
  redis:
    logging: *id001
    image: redis@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    pull_policy: never
    entrypoint:
    - /bin/sh
    - /opt/industrial-agent/redis-secrets-entrypoint.sh
    secrets:
    - redis_password
    volumes:
    - native-redis:/data
    - ./redis-secrets-entrypoint.sh:/opt/industrial-agent/redis-secrets-entrypoint.sh:ro
    - ./redis-healthcheck.sh:/opt/industrial-agent/redis-healthcheck.sh:ro
    healthcheck:
      test:
      - CMD
      - /bin/sh
      - /opt/industrial-agent/redis-healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
    - data
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  rerank-adapter:
    logging: *id001
    image: python@sha256:a36c24f9cbdf4fd0f52d67f0823eeac19c2028c637cecc392d97f980d4fec56b
    pull_policy: never
    command:
    - python
    - /adapter/rerank_adapter.py
    environment:
      RERANK_UPSTREAM_URL: ${IA_RERANK_URL:-http://host.docker.internal:8092/rerank}
      RERANK_UPSTREAM_TIMEOUT_SECONDS: '30'
      RERANK_ADAPTER_PORT: '8080'
    volumes:
    - ./rerank_adapter.py:/adapter/rerank_adapter.py:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
    - engine
    - model-egress
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:size=16m,mode=1777
    security_opt:
    - no-new-privileges:true
  gateway:
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${IA_GATEWAY_IMAGE:-industrial-agent/gateway:local}
    build:
      context: ../..
      dockerfile: deployment/industrial-agent/Dockerfile.gateway
    pull_policy: never
    environment:
      TZ: Asia/Shanghai
      RAG_ROOT_PATH: /kb
      INDUSTRIAL_AGENT_GATEWAY_DATA_DIR: /data
      IA_QA_MAX_ACTIVE: ${IA_QA_MAX_ACTIVE:-8}
      INDUSTRIAL_AGENT_SUPER_ADMIN_USER_IDS: ${IA_SUPER_ADMIN_USER_IDS:-}
      INDUSTRIAL_AGENT_GATEWAY_DEPLOYMENT_ID: ${IA_DEPLOYMENT_ID:?必须填写独立候选部署 ID}
      RAG_INDUSTRIAL_AGENT_SSO_DEPLOYMENT_ID: ${IA_DEPLOYMENT_ID:?必须填写独立候选部署 ID}
      RAG_INDUSTRIAL_AGENT_AUTH_MODE: sso
      RAG_INDUSTRIAL_AGENT_SSO_ENTRIES: ${IA_SSO_ENTRIES:?必须填写现场真实登记的入口 JSON}
      RAG_INDUSTRIAL_AGENT_SSO_VALIDATE_URL: ${IA_SSO_VALIDATE_URL:?必须填写内网验证地址}
      RAG_INDUSTRIAL_AGENT_SSO_CLIENT_ID: ${IA_SSO_CLIENT_ID:?必须填写候选 Client ID}
      RAG_INDUSTRIAL_AGENT_SSO_CLIENT_SECRET_FILE: /run/ia-secrets/sso_client_secret
      RAG_MASTER_KEY_FILE: /run/ia-secrets/gateway_master_key
      RAG_ADMIN_BOOTSTRAP_TOKEN_FILE: /run/ia-secrets/gateway_admin_bootstrap_token
      RAG_TRUSTED_ORIGINS: ${IA_PUBLIC_ORIGIN:?必须填写已登记的候选 Origin}
      RAG_TRUSTED_PROXIES: ${IA_EDGE_IP:-172.30.96.3}
      KNOWLEDGE_ENGINE_BASE_URL: http://app:8080
      KNOWLEDGE_ENGINE_TENANT_ID: ${IA_ENGINE_TENANT_ID:-}
      KNOWLEDGE_ENGINE_PUBLIC_KB_IDS: ${IA_PUBLIC_KB_IDS:-}
      KNOWLEDGE_ENGINE_API_KEY_FILE: /run/ia-secrets/workspace_api_key
      KNOWLEDGE_ENGINE_EXTERNAL_SIGNING_KEY_FILE: /run/ia-secrets/external_signing_key
      KNOWLEDGE_ENGINE_ADMIN_EMAIL: ${IA_ENGINE_ADMIN_EMAIL:?请填写引擎服务账号邮箱}
      KNOWLEDGE_ENGINE_ADMIN_PASSWORD_FILE: /run/ia-secrets/knowledgeengine_admin_password
      INDUSTRIAL_AGENT_BLOCKED_DEPT_IDS: ${IA_BLOCKED_DEPT_IDS:-}
      INDUSTRIAL_AGENT_ADMIN_USERNAMES: ${IA_ADMIN_USERS:-}
      IA_WORKBENCH_ENABLED: ${IA_WORKBENCH_ENABLED:-false}
      IA_WORKBENCH_CHAT_MODEL_ID: ${IA_WORKBENCH_CHAT_MODEL_ID:-}
    volumes:
    - gateway-data:/data
    - type: bind
      source: ${IA_SECRET_DIR:?必须使用独立绝对路径}/sso_client_secret
      target: /run/ia-secrets/sso_client_secret
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${IA_SECRET_DIR:?必须使用独立绝对路径}/gateway_master_key
      target: /run/ia-secrets/gateway_master_key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${IA_SECRET_DIR:?必须使用独立绝对路径}/gateway_admin_bootstrap_token
      target: /run/ia-secrets/gateway_admin_bootstrap_token
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${IA_SECRET_DIR:?必须使用独立绝对路径}/workspace_api_key
      target: /run/ia-secrets/workspace_api_key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${IA_SECRET_DIR:?必须使用独立绝对路径}/external_signing_key
      target: /run/ia-secrets/external_signing_key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${IA_SECRET_DIR:?必须使用独立绝对路径}/knowledgeengine_admin_password
      target: /run/ia-secrets/knowledgeengine_admin_password
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      app:
        condition: service_healthy
    networks:
    - front
    - engine
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    security_opt:
    - no-new-privileges:true
  edge:
    logging: *id002
    image: ${IA_EDGE_IMAGE:-industrial-agent/edge:local}
    build:
      context: ../..
      dockerfile: deployment/industrial-agent/Dockerfile.edge
    pull_policy: never
    ports:
    - ${IA_BIND_IP:-127.0.0.1}:${IA_PORT:-18300}:8080
    depends_on:
    - gateway
    networks:
      front:
        ipv4_address: ${IA_EDGE_IP:-172.30.96.3}
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /var/cache/nginx:size=16m
    - /var/run:size=2m
    - /tmp:size=16m
    security_opt:
    - no-new-privileges:true
  ocr-relay:
    profiles: [ocr]
    image: python@sha256:a36c24f9cbdf4fd0f52d67f0823eeac19c2028c637cecc392d97f980d4fec56b
    pull_policy: never
    networks:
    - engine
    - model-egress
    command:
    - python
    - /adapter/ocr_relay.py
    environment:
      IA_OCR_UPSTREAM: ${IA_OCR_UPSTREAM:-}
      IA_OCR_BIND_HOST: 0.0.0.0
      IA_OCR_BIND_PORT: '18097'
    volumes:
    - ./ocr_relay.py:/adapter/ocr_relay.py:ro
    read_only: true
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:18097/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  engine:
    internal: true
  data:
    internal: true
  model-egress: {}
  front:
    ipam:
      config:
      - subnet: ${IA_FRONT_SUBNET:-172.30.96.0/24}
volumes:
  native-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IA_DATA_ROOT:?必须使用独立绝对路径}/postgres
  native-redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IA_DATA_ROOT:?必须使用独立绝对路径}/redis
  native-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IA_DATA_ROOT:?必须使用独立绝对路径}/files
  docreader-tmp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IA_DATA_ROOT:?必须使用独立绝对路径}/docreader-tmp
  gateway-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IA_DATA_ROOT:?必须使用独立绝对路径}/gateway
secrets:
  db_password:
    file: ${IA_SECRET_DIR:?必须使用独立绝对路径}/db_password
  redis_password:
    file: ${IA_SECRET_DIR:?必须使用独立绝对路径}/redis_password
  jwt_secret:
    file: ${IA_SECRET_DIR:?必须使用独立绝对路径}/jwt_secret
  system_aes_key:
    file: ${IA_SECRET_DIR:?必须使用独立绝对路径}/system_aes_key
  system_signing_key:
    file: ${IA_SECRET_DIR:?必须使用独立绝对路径}/system_signing_key
