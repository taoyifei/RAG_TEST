server {
    listen 8080;
    server_name _;
    server_tokens off;
    # 多级代理的外部协议和端口由浏览器保留，不把内部 8080 写进跳转地址。
    absolute_redirect off;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        root /usr/share/nginx/html;
        try_files /kb/index.html =404;
    }
    location = /admin { return 308 /kb/admin/; }
    location = /admin/ops { return 308 /kb/admin/overview; }
    location = /admin/ops/ { return 308 /kb/admin/overview; }
    location = /kb { return 308 /kb/; }
    location = /kb/admin { return 308 /kb/admin/; }
    location = /kb/admin/ops { return 308 /kb/admin/overview; }
    location = /kb/admin/ops/ { return 308 /kb/admin/overview; }

    # 浏览器只能到工业智能体网关；不向原生 app 开放 /api/v1 或 /files。
    location ^~ /api/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /kb/api/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /kb/sso/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /sso/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /kb/admin/ops/api/ {
        proxy_pass http://gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # 旧运营页书签统一进入 Vue 管理站；真实管理 API 仍走 /api/。
    location ^~ /kb/admin/ops/ {
        return 308 /kb/admin/overview;
    }

    location ^~ /admin/ops/ {
        return 308 /kb/admin/overview;
    }


    # 工作助手使用独立入口，资源复用管理端构建；后端仍逐请求校验本人范围。
    location ^~ /kb/workbench/ {
        root /usr/share/nginx/html;
        try_files /kb/admin/workbench.html =404;
    }

    location ^~ /workbench/ {
        root /usr/share/nginx/html;
        try_files /kb/admin/workbench.html =404;
    }


    location ^~ /kb/admin/docs/ {
        root /usr/share/nginx/html;
        types { text/plain md; }
        default_type text/plain;
        try_files $uri $uri.md ${uri}index.md =404;
    }

    location ^~ /kb/admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /kb/admin/index.html;
    }

    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /kb/admin/$1 last;
    }

    location ^~ /kb/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /kb/index.html;
    }

    location ^~ /assets/ {
        alias /usr/share/nginx/html/kb/assets/;
    }

    location / { return 404; }
}
