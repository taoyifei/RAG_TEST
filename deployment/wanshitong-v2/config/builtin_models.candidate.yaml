# WeKnora v0.9.0 测试栈声明式模型，复用已有GPU服务。
# 普通问答经60模型池接入57/58四路24K模型；API Key不写入此文件。
builtin_models:
  - id: wkab-qwen3-8b-awq
    type: KnowledgeQA
    source: remote
    is_default: true
    name: Qwen/Qwen3-8B-AWQ
    parameters:
      base_url: http://10.242.180.60:18098/v1
      provider: generic
      context_window: 24576
      max_output_tokens: 2048

  - id: wkab-qwen3-embedding-0-6b
    type: Embedding
    source: remote
    is_default: true
    name: Qwen3-Embedding-0.6B
    parameters:
      base_url: http://host.docker.internal:8091/v1
      provider: generic
      embedding_parameters:
        dimension: 1024
        truncate_prompt_tokens: 0

  - id: wkab-qwen3-reranker-0-6b
    type: Rerank
    source: remote
    is_default: true
    name: Qwen3-Reranker-0.6B
    parameters:
      base_url: http://rerank-adapter:8080
      provider: generic
      extra_config:
        score_scale: probability

  - id: wxd-paddleocr-vl
    type: VLLM
    source: remote
    is_default: true
    name: PaddleOCR-VL-1.6-0.9B
    parameters:
      base_url: http://host.docker.internal:18095/v1
      provider: generic
      interface_type: openai
