# 湾小度 V2：仅用于 8289，禁止引用生产数据卷或生产 Compose project。
name: ${WXD_PROJECT_NAME:-wxd_v2_090_8289}
services:
  app:
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${WXD_APP_IMAGE:?必须填写固定090官方镜像ID}
    pull_policy: never
    entrypoint:
    - /bin/sh
    - /opt/wst/weknora-secrets-entrypoint.sh
    command:
    - ./WeKnora
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
      LOG_LEVEL: info
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      UV_OFFLINE: 'true'
      PIP_NO_INDEX: '1'
      AUTO_MIGRATE: 'true'
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: wxd_test
      DB_NAME: wxd_v2_test
      RETRIEVE_DRIVER: postgres
      DOCREADER_ADDR: docreader:50051
      DOCREADER_TRANSPORT: grpc
      REDIS_ADDR: redis:6379
      REDIS_PREFIX: wxd_v2_test_8289
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      DISABLE_REGISTRATION: ${WST_DISABLE_REGISTRATION:-true}
      WEKNORA_TENANT_SELF_SERVICE_CREATION_ENABLED: ${WXD_NATIVE_WORKBENCH_PROVISIONING:-false}
      WEKNORA_TENANT_MAX_OWNED_PER_USER: ${WXD_NATIVE_MAX_OWNED_WORKSPACES:-10}
      WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${WXD_NATIVE_BOOTSTRAP_ADMIN_EMAIL:-}
      WEKNORA_TENANT_ENABLE_CROSS_TENANT_ACCESS: 'false'
      WEKNORA_SANDBOX_DOCKER_ENABLED: 'false'
      BROWSERSKILL_BINARY: ''
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_OPTIONAL: 'true'
      LANGFUSE_ENABLED: 'false'
      SSRF_DNS_WHITELIST_ONLY: 'true'
      SSRF_WHITELIST: ${WST_ALLOWED_MODEL_HOSTS:?必须填内网模型服务主机白名单}
      SSRF_WHITELIST_EXTRA: docreader,rerank-adapter
      CONCURRENCY_POOL_SIZE: '1'
      WEKNORA_MODEL_MAX_CONCURRENCY: '1'
    secrets:
    - db_password
    - redis_password
    - jwt_secret
    - system_aes_key
    - system_signing_key
    volumes:
    - native-files:/data/files
    - docreader-tmp:/tmp/docreader:ro
    - ./config/config.candidate.yaml:/app/config/config.yaml:ro
    - ./config/builtin_models.candidate.yaml:/app/config/builtin_models.yaml:ro
    - ./weknora-secrets-entrypoint.sh:/opt/wst/weknora-secrets-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docreader:
        condition: service_healthy
      rerank-adapter:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - engine
    - data
    - model-egress
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  docreader:
    logging: *id001
    image: ${WXD_DOCREADER_IMAGE:?必须填写固定090解析镜像ID}
    pull_policy: never
    environment:
      TZ: Asia/Shanghai
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      UV_OFFLINE: 'true'
      PIP_NO_INDEX: '1'
      DOCREADER_GRPC_PORT: '50051'
      DOCREADER_ODL_HYBRID: 'off'
      SSRF_DNS_WHITELIST_ONLY: 'true'
      SSRF_WHITELIST_EXTRA: ''
    volumes:
    - docreader-tmp:/tmp/docreader
    expose:
    - '50051'
    healthcheck:
      test:
      - CMD
      - grpc_health_probe
      - -addr=localhost:50051
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - engine
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  postgres:
    logging: *id001
    image: paradedb/paradedb@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2
    pull_policy: never
    environment:
      POSTGRES_USER: wxd_test
      POSTGRES_DB: wxd_v2_test
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
    - db_password
    volumes:
    - native-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U wxd_test -d wxd_v2_test
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
    - data
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
    - no-new-privileges:true
  redis:
    logging: *id001
    image: redis@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    pull_policy: never
    entrypoint:
    - /bin/sh
    - /opt/wst/redis-secrets-entrypoint.sh
    secrets:
    - redis_password
    volumes:
    - native-redis:/data
    - ./redis-secrets-entrypoint.sh:/opt/wst/redis-secrets-entrypoint.sh:ro
    - ./redis-healthcheck.sh:/opt/wst/redis-healthcheck.sh:ro
    healthcheck:
      test:
      - CMD
      - /bin/sh
      - /opt/wst/redis-healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
    - data
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  rerank-adapter:
    logging: *id001
    image: python@sha256:a36c24f9cbdf4fd0f52d67f0823eeac19c2028c637cecc392d97f980d4fec56b
    pull_policy: never
    command:
    - python
    - /adapter/rerank_adapter.py
    environment:
      RERANK_UPSTREAM_URL: http://host.docker.internal:8092/rerank
      RERANK_UPSTREAM_TIMEOUT_SECONDS: '30'
      RERANK_ADAPTER_PORT: '8080'
    volumes:
    - ./rerank_adapter.py:/adapter/rerank_adapter.py:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
    - engine
    - model-egress
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:size=16m,mode=1777
    security_opt:
    - no-new-privileges:true
  gateway:
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${WST_GATEWAY_IMAGE:?必须填写本次构建后固定的网关镜像引用}
    pull_policy: never
    environment:
      TZ: Asia/Shanghai
      RAG_ROOT_PATH: /kb
      WANSHITONG_GATEWAY_DATA_DIR: /data
      WXD_QA_MAX_ACTIVE: ${WXD_QA_MAX_ACTIVE:-8}
      WANSHITONG_SUPER_ADMIN_USER_IDS: ${WXD_SUPER_ADMIN_USER_IDS:-325}
      WANSHITONG_GATEWAY_DEPLOYMENT_ID: ${WST_DEPLOYMENT_ID:?必须填写独立候选部署 ID}
      RAG_WANSHITONG_SSO_DEPLOYMENT_ID: ${WST_DEPLOYMENT_ID:?必须填写独立候选部署 ID}
      RAG_WANSHITONG_AUTH_MODE: sso
      RAG_WANSHITONG_SSO_ENTRIES: ${WST_SSO_ENTRIES:?必须填写现场真实登记的入口 JSON}
      RAG_WANSHITONG_SSO_VALIDATE_URL: ${WST_SSO_VALIDATE_URL:?必须填写内网验证地址}
      RAG_WANSHITONG_SSO_CLIENT_ID: ${WST_SSO_CLIENT_ID:?必须填写候选 Client ID}
      RAG_WANSHITONG_SSO_CLIENT_SECRET_FILE: /run/wst-secrets/sso_client_secret
      RAG_MASTER_KEY_FILE: /run/wst-secrets/gateway_master_key
      RAG_ADMIN_BOOTSTRAP_TOKEN_FILE: /run/wst-secrets/gateway_admin_bootstrap_token
      RAG_TRUSTED_ORIGINS: ${WST_PUBLIC_ORIGIN:?必须填写已登记的候选 Origin}
      RAG_TRUSTED_PROXIES: ${WXD_EDGE_IP:-192.168.88.3}
      WEKNORA_BASE_URL: http://app:8080
      WEKNORA_TENANT_ID: ${WST_WEKNORA_TENANT_ID:?必须填写原生 workspace 的真实 tenant ID}
      WEKNORA_PUBLIC_KB_IDS: ${WST_PUBLIC_KB_IDS:?必须填写已发布的非空原生 KB ID 列表}
      WEKNORA_API_KEY_FILE: /run/wst-secrets/workspace_api_key
      WEKNORA_EXTERNAL_SIGNING_KEY_FILE: /run/wst-secrets/external_signing_key
      WEKNORA_ADMIN_EMAIL: ${WST_WEKNORA_ADMIN_EMAIL:?必须填写候选专属原生管理员邮箱}
      WEKNORA_ADMIN_PASSWORD_FILE: /run/wst-secrets/weknora_admin_password
      WANSHITONG_ADMIN_USERNAMES: ${WXD_ADMIN_USERS:-taoyifei}
      WXD_WORKBENCH_ENABLED: ${WXD_WORKBENCH_ENABLED:-false}
      WXD_WORKBENCH_CHAT_MODEL_ID: ${WXD_WORKBENCH_CHAT_MODEL_ID:-}
    volumes:
    - gateway-data:/data
    - type: bind
      source: ${WST_SECRET_DIR:?必须使用独立绝对路径}/sso_client_secret
      target: /run/wst-secrets/sso_client_secret
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${WST_SECRET_DIR:?必须使用独立绝对路径}/gateway_master_key
      target: /run/wst-secrets/gateway_master_key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${WST_SECRET_DIR:?必须使用独立绝对路径}/gateway_admin_bootstrap_token
      target: /run/wst-secrets/gateway_admin_bootstrap_token
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${WST_SECRET_DIR:?必须使用独立绝对路径}/workspace_api_key
      target: /run/wst-secrets/workspace_api_key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${WST_SECRET_DIR:?必须使用独立绝对路径}/external_signing_key
      target: /run/wst-secrets/external_signing_key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${WST_SECRET_DIR:?必须使用独立绝对路径}/weknora_admin_password
      target: /run/wst-secrets/weknora_admin_password
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      app:
        condition: service_healthy
    networks:
    - front
    - engine
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    security_opt:
    - no-new-privileges:true
  edge:
    logging: *id002
    image: ${WST_EDGE_IMAGE:?必须填写本次构建后固定的静态前端镜像引用}
    pull_policy: never
    ports:
    - ${WST_BIND_IP:-127.0.0.1}:${WST_CANDIDATE_PORT:?初始使用已核查空闲的临时端口，8289测试切换须先保留旧版}:8080
    depends_on:
    - gateway
    networks:
      front:
        ipv4_address: ${WXD_EDGE_IP:-192.168.88.3}
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /var/cache/nginx:size=16m
    - /var/run:size=2m
    - /tmp:size=16m
    security_opt:
    - no-new-privileges:true
  ocr-relay:
    image: python@sha256:a36c24f9cbdf4fd0f52d67f0823eeac19c2028c637cecc392d97f980d4fec56b
    pull_policy: never
    network_mode: host
    command:
    - python
    - /adapter/ocr_relay.py
    environment:
      WXD_OCR_UPSTREAM: ${WXD_OCR_UPSTREAM:?必须只读核对现有OCR模型IP后填写}
      WXD_OCR_BIND_HOST: 172.17.0.1
      WXD_OCR_BIND_PORT: '18097'
    volumes:
    - ./ocr_relay.py:/adapter/ocr_relay.py:ro
    read_only: true
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://172.17.0.1:18097/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  engine:
    internal: true
    ipam:
      config:
      - subnet: 192.168.89.0/24
  data:
    internal: true
    ipam:
      config:
      - subnet: 192.168.90.0/24
  model-egress:
    ipam:
      config:
      - subnet: 192.168.91.0/24
  front:
    ipam:
      config:
      - subnet: ${WXD_FRONT_SUBNET:-192.168.88.0/24}
volumes:
  native-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WXD_DATA_ROOT:?必须使用独立绝对路径}/postgres
  native-redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WXD_DATA_ROOT:?必须使用独立绝对路径}/redis
  native-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WXD_DATA_ROOT:?必须使用独立绝对路径}/files
  docreader-tmp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WXD_DATA_ROOT:?必须使用独立绝对路径}/docreader-tmp
  gateway-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WXD_DATA_ROOT:?必须使用独立绝对路径}/gateway
secrets:
  db_password:
    file: ${WST_SECRET_DIR:?必须使用独立绝对路径}/db_password
  redis_password:
    file: ${WST_SECRET_DIR:?必须使用独立绝对路径}/redis_password
  jwt_secret:
    file: ${WST_SECRET_DIR:?必须使用独立绝对路径}/jwt_secret
  system_aes_key:
    file: ${WST_SECRET_DIR:?必须使用独立绝对路径}/system_aes_key
  system_signing_key:
    file: ${WST_SECRET_DIR:?必须使用独立绝对路径}/system_signing_key
